title = "gitleaks"

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_\-]?key|secret|private[_\-]?key|seed[_\-]?phrase)\s*[:=]\s*['\"]?[A-Za-z0-9/\+]{16,}'''
tags = ["key", "secret"]

[allowlist]
description = "Env template only — markdown is scanned; docs must not contain live credentials"
paths = [
  '''\.env\.example$''',
]
