title = "gitleaks"

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_\-]?key|secret|private[_\-]?key|seed[_\-]?phrase)\s*[:=]\s*['\"]?[A-Za-z0-9/\+]{16,}'''
tags = ["key", "secret"]

[allowlist]
description = "Env template only. Markdown is scanned. Dependencies and lockfile are not credential sources."
paths = [
  '''\.env\.example$''',
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''pnpm-lock\.yaml$''',
  '''playwright-report/''',
  '''test-results/''',
]
